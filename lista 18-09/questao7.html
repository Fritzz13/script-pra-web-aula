<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Questao 7</title>
  </head>
  
  <body>
    <script>
      const turno = Number(prompt("Escolha o turno: "));
      
      switch(turno) {
        case 1:
          console.log("Turno: Manhã");
          break;
        case 2:
          console.log("Turno: Tarde");
          break;
        case 3:
          console.log("Turno: Noite");
          break;
        default:
          console.log("Turno inválido");
          break;
      }
    </script>
  </body>
</html>
