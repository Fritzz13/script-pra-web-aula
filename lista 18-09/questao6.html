<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Questao 6</title>
  </head>
  
  <body>
    <script>
      const temperatura = Number(prompt("Informe a temperatura ambiente: "));
      
      if (temperatura < 15) {
        console.log(`${temperatura} graus - clima: Fria`);
      } else if (temperatura > 25) {
        console.log(`${temperatura} graus - clima: Quente`);
      } else {
        console.log(`${temperatura} graus - clima: Amena`);
      }
    </script>
  </body>
</html>
