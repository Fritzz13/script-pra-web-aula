<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Questao 3</title>
  </head>
  
  <body>
    <script>
      const valorvendido = parseFloat(prompt("Informe o valor vendido: "));
      const meta = parseFloat(prompt("Informe a meta do mês: "));
      
      console.log(`Vendido: ${valorvendido} | Meta: ${meta} \nAtingiu a meta?  ${valorvendido >= meta} \nSuperou a meta?  ${valorvendido > meta} \nBateu exatamente? ${valorvendido === meta} \nDiferença: ${valorvendido - meta} \n`);
    </script>
  </body>
</html>
