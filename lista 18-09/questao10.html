<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Questao 10</title>
  </head>
  
  <body>
    <script>
      const n = parseInt(prompt("Digite um número N: "));
      let par = 0;
      let impar = 0;
      
      for(let i = 1; i <= n; i++) {
        if (i % 2 == 0) {
          par++;
          console.log(`${i} - par \n`);
        } else {
          impar++;
          console.log(`${i} - ímpar \n`);
        }
      }
      
      console.log(`-------------------- \n`);
      console.log(`Pares: ${par} \nÍmpares: ${impar} \n`);
    </script>
  </body>
</html>
