<html lang="pt-br">

  <body>
    <script>
      const numero = parseInt(prompt("Digite um número: "));
      
      for(let i = 1; i <= 10; i++) {
        console.log(`${numero} x ${i} = ${numero * i} \n`);
      }
    </script>
